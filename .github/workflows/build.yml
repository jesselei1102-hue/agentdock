name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detector smoke test
        run: python3 lib/detect.py --demo --format json
      - name: Build (unsigned)
        working-directory: native
        run: |
          xcodebuild -project AgentStatusBar.xcodeproj -scheme AgentStatusBar \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Ad-hoc sign and zip
        run: |
          cd native/build/Build/Products/Release
          codesign --force --deep -s - AgentDock.app
          codesign --verify --deep AgentDock.app
          ditto -c -k --keepParent AgentDock.app AgentDock.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AgentDock
          path: native/build/Build/Products/Release/AgentDock.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" native/build/Build/Products/Release/AgentDock.zip \
            --title "AgentDock $GITHUB_REF_NAME" --generate-notes
